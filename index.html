<!DOCTYPE html>
<html lang="es">
<head>
    <title>Corriendo a los 15</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --primary: #ff6b9d;
            --secondary: #9d4edd;
            --accent: #ffd166;
            --background: #f8f9fa;
            --text: #333;
            --pixel-border: 4px solid #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--background);
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
            background-image: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            touch-action: manipulation; /* Previene zoom en doble tap en móviles */
        }

        #gameContainer {
            position: relative;
            width: 100%;
            /* Ajuste para mejor visualización en diferentes aspect ratios */
            aspect-ratio: 16 / 9;
            max-width: 90vw; /* Usa viewport width */
            max-height: 80vh; /* Usa viewport height */
            min-width: 300px; /* Evita que sea demasiado pequeño */
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin: 10px auto; /* Centrado horizontal */
            border: var(--pixel-border);
            image-rendering: pixelated;
            background: #87CEEB; /* Fondo inicial mientras carga canvas */
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;

            background-repeat: repeat;
        }

        #startScreen h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em; /* Ajuste dinámico basado en viewport más adelante */
            margin: 0.5em 0;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
            color: #ffd166;
            animation: pulse 2s infinite;
            letter-spacing: -1px;
        }

        #startScreen p {
            font-size: 1.5em; /* Ajuste dinámico basado en viewport más adelante */
            margin: 0.5em 0;
            max-width: 80%;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
        }

        .pixel-button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: var(--accent);
            color: var(--text);
            border: 4px solid #333;
            font-size: 1.2em; /* Ajuste dinámico basado en viewport más adelante */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            image-rendering: pixelated;
        }

        .pixel-button:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.5);
        }

        .pixel-button:active {
            transform: translateY(1px);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
        }

        #scoreBoard {
            background-color: #333;
            padding: 10px 20px;
            border-radius: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 15px;
            font-size: 1.5em; /* Ajuste dinámico basado en viewport más adelante */
            font-weight: bold;
            color: white;
            display: flex;
            gap: 15px;
            width: 90%;
            max-width: 400px;
            justify-content: center;
            border: var(--pixel-border);
            font-family: 'Press Start 2P', cursive;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-value {
            color: var(--accent);
        }

        .phase-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 0;
            font-weight: bold;
            color: white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            font-size: 1.1em; /* Ajuste dinámico basado en viewport más adelante */
            border: 2px solid #fff;
            font-family: 'Press Start 2P', cursive;
        }

        .phase-name {
            color: var(--accent);
            font-size: 1.3em; /* Relativo al padre .phase-indicator */
        }

        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .decoration {
            position: absolute;
            opacity: 0.7;
        }

        .balloon {
            width: 30px;
            height: 40px;
            background-color: var(--primary);
            border-radius: 0;
            animation: float 5s infinite ease-in-out;
            border: 2px solid #333;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 13px;
            width: 4px;
            height: 15px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .confetti {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            transform: rotate(45deg);
            animation: fall 8s infinite linear;
            border: 1px solid #333;
        }

        #jumpButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 0;
            display: none; /* Oculto por defecto, mostrado en media query */
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 100;
            border: var(--pixel-border);
            outline: none;
            font-family: 'Press Start 2P', cursive;
            user-select: none; /* Evita selección de texto al tocar */
        }

        #jumpButton:active {
            transform: scale(0.95);
        }

        #orientationMessage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
            padding: 20px;
            font-family: 'Press Start 2P', cursive;
        }

        #orientationMessage img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: rotate 2s infinite;
        }

        .share-buttons {
            display: flex;
            flex-wrap: wrap; /* Permite que los botones se envuelvan en pantallas pequeñas */
            gap: 10px;
            margin-top: 15px;
            justify-content: center; /* Centra los botones */
        }

        .share-button {
            padding: 8px 15px;
            border: 2px solid #fff;
            background-color: #333;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none; /* Para enlaces */
        }

        .share-button.whatsapp {
            background-color: #25D366;
        }

        .share-button.instagram {
            background: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
        }

        .share-button img {
            width: 20px;
            height: 20px;
        }

        /* Animaciones (sin cambios) */
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(45deg); }
            100% { transform: translateY(calc(100vh + 100px)) rotate(405deg); } /* Asegura que caiga fuera de la pantalla */
        }

        /* Media Queries para Responsividad y Consistencia */

        /* Base font size para cálculos rem/em si es necesario */
        html {
           /* font-size: 16px; */ /* O ajustar según necesidad */
        }

        /* Ajustes generales para pantallas más pequeñas */
        @media (max-width: 768px) {
            #gameContainer {
                 /* Se ajusta con aspect-ratio y max-width/height */
                 margin: 5px auto;
            }
            #startScreen h1 { font-size: clamp(1.5em, 4vw, 2em); } /* Tamaño fluido */
            #startScreen p { font-size: clamp(1em, 2.5vw, 1.3em); }
            #scoreBoard { font-size: clamp(0.7em, 2vw, 1em); padding: 8px 15px; max-width: 90%; }
            .pixel-button { padding: 10px 20px; font-size: clamp(0.8em, 2.2vw, 1em); }
            #jumpButton { display: flex; } /* Mostrar botón de salto en táctiles */
            .phase-indicator { font-size: clamp(0.6em, 1.8vw, 0.9em); padding: 5px 10px; }
            .share-button { font-size: clamp(0.6em, 1.8vw, 0.8em); padding: 6px 12px; }
             .share-button img { width: 16px; height: 16px; }
        }

         /* Ajustes más específicos para móviles muy pequeños */
        @media (max-width: 480px) {
             #startScreen h1 { font-size: clamp(1.3em, 5vw, 1.8em); }
             #startScreen p { font-size: clamp(0.9em, 3.5vw, 1.1em); }
             #scoreBoard { font-size: clamp(0.6em, 2.5vw, 0.8em); gap: 10px; }
             .pixel-button { padding: 8px 15px; font-size: clamp(0.7em, 3vw, 0.9em); }
             .phase-indicator { font-size: clamp(0.5em, 2vw, 0.7em); padding: 4px 8px; }
             .share-button { font-size: clamp(0.5em, 2vw, 0.7em); padding: 5px 10px; }
             .share-button img { width: 14px; height: 14px; }
             #jumpButton { width: 50px; height: 50px; font-size: 20px; }
        }

        /* Mensaje de Orientación para móviles en vertical */
        @media screen and (orientation: portrait) and (max-width: 600px) {
             /* El mensaje se muestra vía JS */
        }

        /* Ajustes para pantallas horizontales pero bajas (móviles landscape) */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #gameContainer {
                max-height: 90vh; /* Permitir que ocupe más altura vertical */
            }
            #scoreBoard { margin-top: 5px; }
            #startScreen h1 { font-size: clamp(1.2em, 3vh, 1.8em); margin: 0.2em 0; }
            #startScreen p { font-size: clamp(0.8em, 2vh, 1.1em); margin: 0.2em 0; }
             .pixel-button { padding: 8px 15px; font-size: clamp(0.7em, 2.5vh, 0.9em); }
             .phase-indicator { font-size: clamp(0.6em, 2vh, 0.8em); padding: 4px 8px; }
        }

    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="decorations" id="decorations"></div>
        <canvas id="gameCanvas"></canvas>
        <div class="phase-indicator" id="phaseIndicator">
            Hora: <span class="phase-name" id="clock">08:00</span>
        </div>
        <div id="startScreen">
            <h1>Corriendo a los 15</h1>
            <p>Ayudá a Giu a llegar a su fiesta de 15</p>
            <p>¡Esquiva los obstáculos y llega a tiempo!</p>
            <button id="startButton" class="pixel-button">¡COMENZAR!</button>
        </div>
    </div>
    <div id="scoreBoard">
        <div class="score-item">
            Puntos: <span class="score-value" id="score">0</span>
        </div>
        <div class="score-item">
            Mejor: <span class="score-value" id="highScore">0</span>
        </div>
    </div>

    <button id="jumpButton">↑</button>

    <div id="orientationMessage">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgY2xhc3M9ImZlYXRoZXIgZmVhdGhlci1yb3RhdGUtY3ciPjxwb2x5bGluZSBwb2ludHM9IjEgNCAxIDEwIDcgMTAiPjwvcG9seWxpbmU+PHBhdGggZD0iTTMuNTEgMTVhOSA5IDAgMSAwIDIuMTMtOS4zNkwxIDEwIj48L3BhdGg+PC9zdmc+" alt="Rotar dispositivo">
        <p>Para una mejor experiencia, gira tu dispositivo a modo horizontal</p>
        <button id="dismissOrientation" class="pixel-button">Continuar</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameContainer = document.getElementById('gameContainer');
        const startButton = document.getElementById('startButton');
        const phaseIndicator = document.getElementById('phaseIndicator');
        const clockElement = document.getElementById('clock');
        const decorationsContainer = document.getElementById('decorations');
        const jumpButton = document.getElementById('jumpButton');
        const orientationMessage = document.getElementById('orientationMessage');
        const dismissOrientationButton = document.getElementById('dismissOrientation');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        // Considerar tabletas también como "móviles" para el botón de salto y orientación
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;

        function checkOrientation() {
            // Mostrar mensaje solo en dispositivos táctiles más pequeños en modo vertical
            if (isTouchDevice && window.innerHeight > window.innerWidth && window.innerWidth < 768) {
                 // Solo mostrar si no se ha descartado explícitamente en esta sesión? Podría guardarse en sessionStorage
                 if (sessionStorage.getItem('dismissedOrientation') !== 'true') {
                     orientationMessage.style.display = 'flex';
                 }
            } else {
                orientationMessage.style.display = 'none';
            }
        }

        window.addEventListener('load', () => {
            resizeCanvas(); // Ajustar tamaño inicial
            checkOrientation(); // Comprobar orientación inicial
        });
        window.addEventListener('resize', () => {
            resizeCanvas();
            checkOrientation();
        });

        dismissOrientationButton.addEventListener('click', function() {
            orientationMessage.style.display = 'none';
            sessionStorage.setItem('dismissedOrientation', 'true'); // Recordar que se descartó
        });

        function createDecorations() {
            decorationsContainer.innerHTML = '';
            const numBalloons = isMobile ? 3 : 5; // Mantiene diferencia sutil
            const numConfetti = isMobile ? 8 : 15; // Mantiene diferencia sutil

            for (let i = 0; i < numBalloons; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'decoration balloon';
                balloon.style.left = `${Math.random() * 100}%`;
                balloon.style.top = `${Math.random() * 50}%`;
                balloon.style.backgroundColor = getRandomColor();
                balloon.style.animationDelay = `${Math.random() * 5}s`;
                decorationsContainer.appendChild(balloon);
            }

            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'decoration confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.backgroundColor = getRandomColor();
                confetti.style.animationDelay = `${Math.random() * 8}s`;
                decorationsContainer.appendChild(confetti);
            }
            decorationsContainer.style.display = 'block';
        }

        function getRandomColor() {
            const colors = ['#ff6b9d', '#9d4edd', '#ffd166', '#06d6a0', '#118ab2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        createDecorations(); // Crear decoraciones al inicio

        // --- Imágenes (sin cambios) ---
        const backgroundImageDay = new Image();
        backgroundImageDay.src = 'Fondo/Fondo.jpeg';
        const backgroundImageSunset = new Image();
        backgroundImageSunset.src = 'Fondo/Fondo_atardecer.jpeg';
        const backgroundImageNight = new Image();
        backgroundImageNight.src = 'Fondo/Fondo_noche.jpeg';

        const schoolImage = new Image(); schoolImage.src = 'Fondo/Saint Jean.png';
        const charmantImage = new Image(); charmantImage.src = 'Fondo/Cartel_Charmant.png';
        const campitoImage = new Image(); campitoImage.src = 'Fondo/El campito.png';
        const hogwartsImage = new Image(); hogwartsImage.src = 'Fondo/Hogwarts.png';

        const playerSprites = {
            run: { image: new Image(), frameCount: 6, framesPerRow: 2, spriteWidth: 1024, spriteHeight: 1024 },
            jump: { image: new Image(), frameCount: 4, framesPerRow: 2, spriteWidth: 1024, spriteHeight: 1024 }
        };
        playerSprites.run.image.src = "Sprites/sprites_giu_corriendo.png";
        playerSprites.jump.image.src = "Sprites/sprites_giu_saltando (1).png";

        const balloonImage = new Image(); balloonImage.src = "Enemigos/balloons.png";
        const numBalloonsPerRow = 3, numBalloonsPerCol = 3;
        const balloonSpriteWidth = 1024 / numBalloonsPerRow;
        const balloonSpriteHeight = 1024 / numBalloonsPerCol;

        const cakeImage = new Image(); cakeImage.src = "Enemigos/cakes.png";
        const numCakesPerRow = 3;
        const cakeSpriteWidth = 1024 / numCakesPerRow;
        const cakeSpriteHeight = 1024 / numCakesPerRow;
        // --- Fin Imágenes ---

        // --- Variables de Estado del Juego ---
        let gameStarted = false;
        let animationFrameId; // Para cancelar el bucle del juego
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameSpeed = 5; // Velocidad base, se ajustará por fase
        let gravity = 0.6; // Ajustado ligeramente para que se sienta bien con tamaños variables
        let lastObstacleTime = 0; // Tiempo real desde el último obstáculo
        let minObstacleGapTime = 1.2; // Mínimo segundos entre obstáculos (se ajustará)
        // let gameTime = 0; // NO USADO para el reloj, solo para lógica interna si es necesario

        let obstacles = [];
        let phase = 0;
        const phases = [
            { name: 'Peluquería', difficulty: 1, color: '#FFB6C1', endHour: 12 }, // Termina a las 12:00
            { name: 'Maquillaje', difficulty: 1.5, color: '#98FB98', endHour: 17 }, // Termina a las 17:00
            { name: 'Vestuario', difficulty: 2, color: '#DDA0DD', endHour: 20 }, // Termina a las 20:00
            { name: 'Salón', difficulty: 2.5, color: '#FFD700', endHour: 22 }      // Termina a las 22:00
        ];

        const phaseObstacles = [ // Definiciones de obstáculos por fase (sin cambios)
            [
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -180, high: true, balloonIndex: 0 },
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -70, high: false, balloonIndex: 1 },
                { type: 'torta', baseWidth: 50, baseHeight: 50, yOffset: -100 }
            ],
            [
                { type: 'globo', baseWidth: 30, baseHeight: 30, yOffset: -180, high: true, balloonIndex: 2 },
                { type: 'globo', baseWidth: 30, baseHeight: 30, yOffset: -70, high: false, balloonIndex: 3 },
                { type: 'torta', baseWidth: 40, baseHeight: 40, yOffset: -100 }
            ],
            [
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -180, high: true, balloonIndex: 4 },
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -70, high: false, balloonIndex: 5 },
                { type: 'torta', baseWidth: 50, baseHeight: 50, yOffset: -100 }
            ],
            [
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -180, high: true, balloonIndex: 6 },
                { type: 'globo', baseWidth: 40, baseHeight: 40, yOffset: -70, high: false, balloonIndex: 7 },
                { type: 'torta', baseWidth: 50, baseHeight: 50, yOffset: -100 }
            ]
        ];


        const player = {
            x: 50, y: 0, // Se inicializa en resizeCanvas
            baseWidth: 80, baseHeight: 80, // Tamaño base
            width: 80, height: 80, // Tamaño actual
            dy: 0, jumping: false,
            frameIndex: 0, tickCount: 0, ticksPerFrame: 6, // Ajustado para animación más fluida
            currentAnimation: 'run', jumpPhase: 0
        };

        // --- Variables de Control de Tiempo ---
        let gameStartTime; // Timestamp del inicio del juego (performance.now())
        const MAX_REAL_TIME_SECONDS = 180; // 3 minutos
        const TOTAL_INGAME_MINUTES = (22 - 8) * 60; // 14 horas * 60 minutos/hora = 840 minutos
        let gameClock = { hours: 8, minutes: 0 };

        // --- Variables de Imágenes de Lugares ---
        let currentBackground = backgroundImageDay;
        let backgroundTransitionProgress = 0;
        let transitionStarted = { 2: false, 3: false };

        let charmantVisible = false, charmantX = 0, charmantBaseWidth = 180, charmantBaseHeight = 180, charmantWidth = 180, charmantHeight = 180;
        let schoolVisible = false, schoolX = 0, schoolBaseWidth = 200, schoolBaseHeight = 200, schoolWidth = 200, schoolHeight = 200;
        let campitoVisible = false, campitoX = 0, campitoBaseWidth = 200, campitoBaseHeight = 180, campitoWidth = 200, campitoHeight = 180;
        let hogwartsVisible = false, hogwartsX = 0, hogwartsBaseWidth = 220, hogwartsBaseHeight = 220, hogwartsWidth = 220, hogwartsHeight = 220;
        let groundHeight = 40; // Altura del suelo
        let locationYOffset = -50; // Cuánto subir los lugares desde el suelo
        // --- Fin Variables de Estado ---

        function resizeCanvas() {
            // Usar las dimensiones del contenedor para el canvas
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;

            // Escala base para adaptar elementos dinámicamente
            const scaleFactor = Math.min(canvas.width / 800, canvas.height / 500); // Escalar relativo a un tamaño base de diseño (ej: 800x500)

            // Ajustar tamaño del jugador
            player.width = player.baseWidth * scaleFactor;
            player.height = player.baseHeight * scaleFactor;
            if (!player.jumping) { // Solo ajustar Y si está en el suelo
                 player.y = canvas.height - groundHeight - player.height;
            }

            // Ajustar tamaños de lugares
            charmantWidth = charmantBaseWidth * scaleFactor; charmantHeight = charmantBaseHeight * scaleFactor;
            schoolWidth = schoolBaseWidth * scaleFactor; schoolHeight = schoolBaseHeight * scaleFactor;
            campitoWidth = campitoBaseWidth * scaleFactor; campitoHeight = campitoBaseHeight * scaleFactor;
            hogwartsWidth = hogwartsBaseWidth * scaleFactor; hogwartsHeight = hogwartsBaseHeight * scaleFactor;

            // Re-calcular Y de obstáculos si existen (importante si el juego ya empezó y se redimensiona)
            obstacles.forEach(obs => {
                 obs.y = canvas.height + obs.yOffset * scaleFactor - obs.height; // yOffset es negativo
                 obs.width = obs.baseWidth * scaleFactor;
                 obs.height = obs.baseHeight * scaleFactor;
            });

             // Ajustar gravedad y salto inicial basado en la escala para mantener la sensación
             // Esto es más complejo, por ahora mantenemos valores fijos
             // gravity = 0.6 * scaleFactor; // Podría necesitar ajuste
             // jumpInitialVelocity = -12 * scaleFactor; // Podría necesitar ajuste

            // Volver a dibujar inmediatamente si el juego está corriendo
            if (gameStarted) {
                draw();
            } else {
                 // Si el juego no ha empezado, dibujar el fondo inicial y el jugador estático
                 ctx.clearRect(0, 0, canvas.width, canvas.height);
                 drawBackground(); // Dibuja el fondo del día por defecto
                 drawGround();
                 // Podríamos dibujar al jugador en estado idle si tuviéramos ese sprite
            }
        }

        function jump() {
            if (!gameStarted) {
                startGame();
            } else if (!player.jumping) {
                player.jumping = true;
                player.dy = -12.5 * Math.sqrt(player.height / player.baseHeight); // Salto escala un poco con tamaño
                player.currentAnimation = 'jump';
                player.frameIndex = 0;
                player.jumpPhase = 0;
            }
        }

        // --- Eventos (optimizados) ---
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault(); // Prevenir scroll de página
                jump();
            }
        });

        // Usar 'pointerdown' para unificar touch y mouse
        gameContainer.addEventListener('pointerdown', (e) => {
             // Evitar que el botón de salto dispare esto también si está dentro del container
             if (e.target !== jumpButton) {
                 e.preventDefault();
                 jump();
             }
        });

        jumpButton.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Prevenir eventos fantasma
            jump();
        });


        startButton.addEventListener('click', startGame);
        // No es necesario el listener de touchstart en startScreen si el botón funciona bien

        // --- Funciones de Compartir (sin cambios, pero asegurar que estén en el scope global) ---
        window.shareOnWhatsApp = function(score) {
            const text = encodeURIComponent(`¡Logré ${score} puntos en Corriendo a los 15! ¡Intenta superarme! Link: ${window.location.href}`); // Añadir enlace al juego
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }
        window.shareOnInstagram = function() {
            alert('Para compartir en Instagram:\n1. Toma una captura de pantalla.\n2. Abre Instagram y crea una nueva Historia o Publicación.');
            // O intentar abrir la app, aunque no garantiza la compartición:
            // window.open('instagram://app', '_blank');
        }
        // --- Fin Funciones de Compartir ---


        function startGame() {
            if (gameStarted) return; // Prevenir múltiples inicios

            gameStarted = true;
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);

            // --- Reseteo Completo del Estado ---
            score = 0;
            phase = 0;
            obstacles = [];
            gameSpeed = 5; // Reiniciar velocidad base
            gameClock = { hours: 8, minutes: 0 };
            clockElement.textContent = '08:00';
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore; // Mostrar highscore actual

            charmantVisible = false; charmantX = canvas.width;
            schoolVisible = false; schoolX = canvas.width;
            campitoVisible = false; campitoX = canvas.width;
            hogwartsVisible = false; hogwartsX = canvas.width;

            currentBackground = backgroundImageDay;
            backgroundTransitionProgress = 0;
            transitionStarted = { 2: false, 3: false };

            player.jumping = false;
            player.dy = 0;
            player.currentAnimation = 'run';
            player.frameIndex = 0;
            resizeCanvas(); // Asegura que el jugador esté en la posición correcta al inicio

            decorationsContainer.style.display = 'none';

            gameStartTime = performance.now(); // Marcar el tiempo de inicio REAL
            lastObstacleTime = gameStartTime; // Inicializar tiempo de último obstáculo

            // Cancelar bucle anterior si existiera (importante en reintentos rápidos)
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            gameLoop(); // Iniciar el nuevo bucle
        }

        function updateClock(elapsedRealTimeSeconds) {
             // Calcular cuántos minutos del juego han pasado basado en el tiempo real
             let proportionOfGameCompleted = Math.min(1, elapsedRealTimeSeconds / MAX_REAL_TIME_SECONDS); // No pasar de 1
             let totalMinutesPassed = Math.floor(proportionOfGameCompleted * TOTAL_INGAME_MINUTES);

             gameClock.hours = 8 + Math.floor(totalMinutesPassed / 60);
             gameClock.minutes = totalMinutesPassed % 60;

             // Formatear y mostrar reloj
             let hoursStr = String(gameClock.hours).padStart(2, '0');
             let minutesStr = String(gameClock.minutes).padStart(2, '0');
             clockElement.textContent = `${hoursStr}:${minutesStr}`;

             // Determinar fase actual
             let currentPhase = 0;
             for (let i = 0; i < phases.length; i++) {
                 if (gameClock.hours < phases[i].endHour) {
                     currentPhase = i;
                     break;
                 }
                 // Si ya pasó la hora final de la última fase, se mantiene en la última fase
                 if (i === phases.length - 1) {
                    currentPhase = i;
                 }
             }

             // Si la fase cambió, actualizar estado
             if (phase !== currentPhase) {
                 phase = currentPhase;
                 // console.log("Nueva fase:", phases[phase].name); // Para depuración
                 updateBackground(); // Cambiar fondo si es necesario
             }

             // Actualizar la velocidad del juego según la fase actual (¡IMPORTANTE!)
             gameSpeed = 5 * phases[phase].difficulty;


             // --- Disparadores de eventos basados en el reloj del juego ---
            const currentTimeInMinutes = (gameClock.hours - 8) * 60 + gameClock.minutes;
            const targetCharmantTime = (8.5 - 8) * 60; // 8:30
            const targetSchoolTime = (9.5 - 8) * 60;   // 9:30
            const targetCampitoTime = (10.5 - 8) * 60; // 10:30
            const targetHogwartsTime = (11.5 - 8) * 60; // 11:30

            if (currentTimeInMinutes >= targetCharmantTime && !charmantVisible) showCharmant();
            if (currentTimeInMinutes >= targetSchoolTime && !schoolVisible) showSchool();
            if (currentTimeInMinutes >= targetCampitoTime && !campitoVisible) showCampito();
            if (currentTimeInMinutes >= targetHogwartsTime && !hogwartsVisible) showHogwarts();

            // --- Condición de Victoria por Tiempo ---
            // Se chequea en update() para detener el bucle correctamente
        }


        function spawnObstacle(currentTime) {
             const phaseIndex = Math.min(phase, phases.length - 1);
             const availableObstacles = phaseObstacles[phaseIndex];
             const template = availableObstacles[Math.floor(Math.random() * availableObstacles.length)];

             // Escala base para tamaño
             const scaleFactor = Math.min(canvas.width / 800, canvas.height / 500);
             let obsWidth = template.baseWidth * scaleFactor;
             let obsHeight = template.baseHeight * scaleFactor;

             // Calcular Y basado en offset y altura del canvas/obstáculo
             let obsY = canvas.height + template.yOffset * scaleFactor - obsHeight; // yOffset es negativo

             const obstacle = {
                 x: canvas.width,
                 y: obsY,
                 width: obsWidth,
                 height: obsHeight,
                 type: template.type,
                 high: template.high, // Mantener referencia si es necesario
                 // Guardar datos base para redimensionamiento
                 baseWidth: template.baseWidth,
                 baseHeight: template.baseHeight,
                 yOffset: template.yOffset,
                 // Índices específicos
                 ...(template.type === 'globo' && { balloonIndex: template.balloonIndex }),
                 ...(template.type === 'torta' && { cakeIndex: Math.floor(Math.random() * 9) })
             };

             obstacles.push(obstacle);
             lastObstacleTime = currentTime; // Registrar el tiempo real de spawn
        }


        function showCharmant() { charmantX = canvas.width; charmantVisible = true; }
        function showSchool() { schoolX = canvas.width; schoolVisible = true; }
        function showCampito() { campitoX = canvas.width; campitoVisible = true; }
        function showHogwarts() { hogwartsX = canvas.width; hogwartsVisible = true; }

        function updateJumpAnimation() {
             // Animación de salto simplificada basada en velocidad vertical
             if (player.dy < -5) player.jumpPhase = 1; // Subiendo rápido
             else if (Math.abs(player.dy) <= 5) player.jumpPhase = 2; // Cerca del ápice
             else if (player.dy > 5) player.jumpPhase = 3; // Bajando rápido
             else player.jumpPhase = 0; // Inicio/Fin
             player.frameIndex = player.jumpPhase;
        }

        function updateBackground() {
             // Cambiar a atardecer al entrar en fase 2 (Vestuario)
             if (phase === 2 && !transitionStarted[2]) {
                 currentBackground = backgroundImageSunset;
                 transitionStarted[2] = true;
             }
             // Cambiar a noche al entrar en fase 3 (Salón)
             else if (phase === 3 && !transitionStarted[3]) {
                 currentBackground = backgroundImageNight;
                 transitionStarted[3] = true;
             }
        }

        function update() {
            if (!gameStarted) return;

            const currentTime = performance.now();
            const elapsedRealTimeSeconds = (currentTime - gameStartTime) / 1000;

            // --- Victoria por Tiempo ---
            if (elapsedRealTimeSeconds >= MAX_REAL_TIME_SECONDS) {
                 endGame(true); // Ganó por llegar a tiempo
                 return; // Detener actualización
            }

            // Actualizar reloj y fase (y gameSpeed dentro de updateClock)
            updateClock(elapsedRealTimeSeconds);

            // Incrementar puntuación (podría basarse en tiempo o distancia)
            score++;
            document.getElementById('score').textContent = score;

            // --- Actualizar Lugares Visibles ---
            const locationSpeedFactor = 0.5; // Mover lugares más lento que obstáculos
            if (charmantVisible) {
                charmantX -= gameSpeed * locationSpeedFactor;
                if (charmantX < -charmantWidth) charmantVisible = false;
            }
            if (schoolVisible) {
                schoolX -= gameSpeed * locationSpeedFactor;
                if (schoolX < -schoolWidth) schoolVisible = false;
            }
            if (campitoVisible) {
                campitoX -= gameSpeed * locationSpeedFactor;
                if (campitoX < -campitoWidth) campitoVisible = false;
            }
            if (hogwartsVisible) {
                hogwartsX -= gameSpeed * locationSpeedFactor;
                if (hogwartsX < -hogwartsWidth) hogwartsVisible = false;
            }

            // --- Actualizar Animación del Jugador ---
            player.tickCount++;
            if (player.tickCount > player.ticksPerFrame) {
                player.tickCount = 0;
                if (!player.jumping) {
                    player.currentAnimation = 'run';
                    player.frameIndex = (player.frameIndex + 1) % playerSprites.run.frameCount;
                } else {
                    player.currentAnimation = 'jump';
                    updateJumpAnimation(); // Actualizar frame de salto
                }
            }

            // --- Física del Jugador ---
            player.y += player.dy;
            player.dy += gravity;

            // Colisión con el suelo
            const groundLevel = canvas.height - groundHeight - player.height;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.jumping = false;
                player.dy = 0;
                if (player.currentAnimation === 'jump') { // Solo cambiar si estaba saltando
                   player.currentAnimation = 'run';
                   player.frameIndex = 0; // Reiniciar animación de correr
                }
            }

            // --- Generar Obstáculos ---
            const timeSinceLastObstacle = (currentTime - lastObstacleTime) / 1000;
             // Hacer que el gap mínimo disminuya ligeramente con la dificultad/velocidad
             let currentMinGap = Math.max(0.7, minObstacleGapTime / phases[phase].difficulty); // Ej: Gap mínimo de 0.7s en fase más difícil

            // Probabilidad aumenta con la fase
            const spawnProbability = 0.01 + phase * 0.005;

            if (timeSinceLastObstacle > currentMinGap && Math.random() < spawnProbability) {
                spawnObstacle(currentTime);
            }

            // --- Actualizar y Comprobar Colisiones con Obstáculos ---
            obstacles = obstacles.filter(obs => obs.x + obs.width > 0); // Eliminar los que salen por la izquierda
            obstacles.forEach(obs => {
                obs.x -= gameSpeed; // Mover obstáculo

                // Detección de Colisión (AABB - Axis-Aligned Bounding Box)
                // Añadir un pequeño margen para que la colisión se sienta más justa
                const collisionMarginX = player.width * 0.15;
                const collisionMarginY = player.height * 0.15;

                const playerLeft = player.x + collisionMarginX;
                const playerRight = player.x + player.width - collisionMarginX;
                const playerTop = player.y + collisionMarginY;
                const playerBottom = player.y + player.height - collisionMarginY;

                const obsLeft = obs.x;
                const obsRight = obs.x + obs.width;
                const obsTop = obs.y;
                const obsBottom = obs.y + obs.height;

                if (playerRight > obsLeft && playerLeft < obsRight &&
                    playerBottom > obsTop && playerTop < obsBottom)
                {
                    endGame(false); // Perdió por colisión
                    return; // Detener actualización para este frame
                }
            });

            // Solicitar el próximo frame
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function drawGround() {
            // Dibujar el suelo con estilo pixel art
            ctx.fillStyle = '#654321'; // Marrón base
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

            // Patrón de pixel art para el suelo (opcional, puede impactar rendimiento)
            /*
            ctx.fillStyle = '#8B4513'; // Marrón más claro
            const pixelSize = 8 * Math.min(canvas.width / 800, canvas.height / 500); // Tamaño de pixel escalado
            for (let i = 0; i < canvas.width; i += pixelSize) {
                for (let j = 0; j < groundHeight; j += pixelSize) {
                    if ((Math.floor(i/pixelSize) + Math.floor(j/pixelSize)) % 2 === 0) { // Patrón ajedrezado
                        ctx.fillRect(i, canvas.height - groundHeight + j, pixelSize, pixelSize);
                    }
                }
            }
            */
        }


        function draw() {
             // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar fondo
            drawBackground();

            // Dibujar lugares
            const locationY = canvas.height - groundHeight + locationYOffset;
            if (charmantVisible) ctx.drawImage(charmantImage, charmantX, locationY - charmantHeight, charmantWidth, charmantHeight);
            if (schoolVisible) ctx.drawImage(schoolImage, schoolX, locationY - schoolHeight, schoolWidth, schoolHeight);
            if (campitoVisible) ctx.drawImage(campitoImage, campitoX, locationY - campitoHeight, campitoWidth, campitoHeight);
            if (hogwartsVisible) ctx.drawImage(hogwartsImage, hogwartsX, locationY - hogwartsHeight, hogwartsWidth, hogwartsHeight);

            // Dibujar suelo
            drawGround();

            // Dibujar jugador
            const currentSprite = playerSprites[player.currentAnimation];
            const col = player.frameIndex % currentSprite.framesPerRow;
            const row = Math.floor(player.frameIndex / currentSprite.framesPerRow);
            const frameX = col * currentSprite.spriteWidth;
            const frameY = row * currentSprite.spriteHeight;

            ctx.drawImage(
                currentSprite.image,
                frameX, frameY,
                currentSprite.spriteWidth, currentSprite.spriteHeight,
                player.x, player.y,
                player.width, player.height
            );

            // Dibujar obstáculos
            obstacles.forEach(obs => {
                if (obs.type === 'globo' && balloonImage.complete && obs.balloonIndex !== undefined) {
                    const balloonCol = obs.balloonIndex % numBalloonsPerRow;
                    const balloonRow = Math.floor(obs.balloonIndex / numBalloonsPerRow);
                    const sourceX = balloonCol * balloonSpriteWidth;
                    const sourceY = balloonRow * balloonSpriteHeight;
                    ctx.drawImage(balloonImage, sourceX, sourceY, balloonSpriteWidth, balloonSpriteHeight, obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'torta' && cakeImage.complete && obs.cakeIndex !== undefined) {
                    const cakeCol = obs.cakeIndex % numCakesPerRow;
                    const cakeRow = Math.floor(obs.cakeIndex / numCakesPerRow);
                    const sourceX = cakeCol * cakeSpriteWidth;
                    const sourceY = cakeRow * cakeSpriteHeight;
                    ctx.drawImage(cakeImage, sourceX, sourceY, cakeSpriteWidth, cakeSpriteHeight, obs.x, obs.y, obs.width, obs.height);
                }
                 // Fallback por si la imagen no carga o falta el índice
                 /* else {
                     ctx.fillStyle = 'red';
                     ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                 } */
            });
        }

        function endGame(isVictory = false) {
            if (!gameStarted) return; // Evitar múltiples llamadas a endGame
            gameStarted = false;
            cancelAnimationFrame(animationFrameId); // Detener el bucle del juego

            startScreen.style.display = 'flex'; // Hacer visible
            startScreen.offsetHeight; // Forzar reflow para que la transición funcione
            startScreen.style.opacity = '1'; // Hacer opaco

             // SVG simple para íconos (reemplazar con imágenes si se prefiere)

            const instagramIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;

            const shareButtonsHTML = `
                <div class="share-buttons">
                    <button class="share-button whatsapp" onclick="shareOnWhatsApp(${score})">
                        ${whatsappIcon} WhatsApp
                    </button>
                    <button class="share-button instagram" onclick="shareOnInstagram()">
                        ${instagramIcon} Instagram
                    </button>
                </div>
            `;

            if (isVictory) {
                startScreen.innerHTML = `
                    <h1>¡FELICIDADES!</h1>
                    <p>¡Giu llegó a la fiesta a tiempo!</p>
                    <p>Puntuación: ${score}</p>
                    <p>Mejor: ${highScore}</p>
                    <button id="startButton" class="pixel-button">¡JUGAR DE NUEVO!</button>
                    ${shareButtonsHTML}
                `;
            } else {
                startScreen.innerHTML = `
                    <h1>GAME OVER</h1>
                    <p>Puntuación: ${score}</p>
                    <p>Mejor: ${highScore}</p>
                    <button id="startButton" class="pixel-button">¡INTENTAR OTRA VEZ!</button>
                    ${shareButtonsHTML}
                `;
            }

            // Re-asignar el listener al nuevo botón de inicio/reintento
            document.getElementById('startButton').addEventListener('click', startGame);

            // Volver a crear y mostrar decoraciones
            createDecorations();
        }

        function gameLoop() {
            // El bucle ahora se inicia/detiene y se maneja con animationFrameId
            // La lógica principal está en update() y draw()
            update();
            draw();
            // requestAnimationFrame es llamado al final de update() si el juego debe continuar
        }

        // --- Inicialización ---
        document.getElementById('highScore').textContent = highScore;

        // Precarga de imágenes (importante para evitar parpadeos)
        let imagesLoaded = 0;
        const totalImages = 9; // Contar todas las imágenes a precargar
        const onImageLoad = () => {
             imagesLoaded++;
             if (imagesLoaded === totalImages) {
                 console.log("Todas las imágenes cargadas.");
                 resizeCanvas(); // Asegurar tamaño correcto después de cargar todo
                 // Podríamos habilitar el botón de start aquí si estuviera deshabilitado
             }
        };

        backgroundImageDay.onload = onImageLoad;
        backgroundImageSunset.onload = onImageLoad;
        backgroundImageNight.onload = onImageLoad;
        schoolImage.onload = onImageLoad;
        charmantImage.onload = onImageLoad;
        campitoImage.onload = onImageLoad;
        hogwartsImage.onload = onImageLoad;
        playerSprites.run.image.onload = onImageLoad;
        playerSprites.jump.image.onload = onImageLoad;
        balloonImage.onload = onImageLoad; // Añadido
        cakeImage.onload = onImageLoad; // Añadido

        // Asegurarse de que el canvas tenga un tamaño inicial antes de que las imágenes carguen
        resizeCanvas();

    </script>
</body>
</html>
